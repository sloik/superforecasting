name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # README declares a Python 3.8+ floor. 3.8 is not available on the
          # ubuntu-latest image, so the floor is exercised on the last image
          # that ships it.
          - os: ubuntu-22.04
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependency install step: the toolkit is stdlib-only by design.
      - name: Run tests
        run: python3 -m unittest discover -s tests
